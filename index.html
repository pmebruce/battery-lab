<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">

<style id="toolbox-typography-v2">
/* Toolbox typography v2: original tools 11/12 reading scale, compact calculation notes. */
:root,html{font-size:18px!important;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-size:15.84px!important;line-height:1.6}
h1,.brand-title,.brand strong,.brand>span:not(.brand-mark),.app-header h1{font-size:32px!important;line-height:1.3!important}
h2,.panel-heading,.summary-title,[data-slot="dialog-title"]{font-size:19.44px!important;line-height:1.45!important}
h3,.card-title h3{font-size:16.92px!important;line-height:1.5!important}
p,li,dl{font-size:15.84px;line-height:1.7}
label,legend,.field,.field>span,.field label,.setting-label,.count-field,.full-label,.scope-field,.result-label,.result-label strong,.metric>span,.metrics>div>span,.metric-label,.hero-label,.summary-details dt,.derived-values dt,.input-label{font-size:15.84px!important;line-height:1.5!important}
input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="file"]),select,textarea,[role="combobox"],.app-select,.numeric-input[data-slot="input"]{font-size:18px!important;line-height:1.4!important;min-height:48px}
button,[role="tab"],.app-button,.app-select-item,.tab,.nav-button,.finder-filter,.open{font-size:15.84px!important;line-height:1.45!important}
button:not([role="checkbox"]):not([role="radio"]):not([role="switch"]):not(.remove-button):not(.dialog-close):not(.swap-button):not(.fin-adjust button){min-height:44px}
small,.unit,.field-unit,.input-unit,.result-unit,.unit-input>b,.input-combo>span,.input-wrap>span,.input-box>span,.field em,.field small,.field-symbol,.brand p,.brand small,.brand-caption,.top-note,.header-tag,.header-note,.offline,.offline-badge,.status-pill,.status,.confidence-pill,.valid-badge,.eyebrow,.section-num,.category,.short-name,.helper,.help,.hint,.field-note,.field-help,.mode-help,.context,.notice,.note,.warning-card,.model-note,.sidebar-note,.settings-hint,.mass-note,.section-caption,.formula-intro,.formula-intro p,.symbol-note,.limitation,.legend,.chart-legend,.chart-note,.fit-stats,.assessment,.verdict,.errors,.error,.inline-error,.form-error,.layer-footnote,.tool-description,.workspace-head p,.intro-description{font-size:13.68px!important;line-height:1.65!important}
.unit-input>b,.input-unit,.field-unit,.unit{font-style:normal}
.formula,.formula-box,.formula-line,.formula-content,.formula-content code,.accordion-body,.equation,.equation b,.inline-eq,.formula-general,.formula-substitution,.formula-result,.property-readout,.property-readout span,.property-readout code,.method-panel p,.method-notes,.reference p,.details p,.details li,.calculation-notes ul{font-size:15.84px!important;line-height:1.8!important}
.hero-value,.capacity-value,.temperature-value,.secondary-result .temperature-value,.big,.hero-result strong,.hero-result output,.hero-result b{font-size:50.4px!important;line-height:1.15!important;font-variant-numeric:tabular-nums}
.metric strong,.metric b,.metrics b,.metric-value,.metric-card strong,.result-list strong,.result-list dd,.summary-details dd,.derived-values dd,.engineering-results strong,.drawing-meta dd,.unit-result strong,.stack-summary strong,.result-value{font-size:19.8px!important;line-height:1.35!important;font-variant-numeric:tabular-nums}
table,th,td,.part-head,.layers-head,.layer-name strong,.layer-row,.stage-info,.stage-info span,.stage b{font-size:13.68px!important;line-height:1.6!important}
.metrics b{overflow-wrap:anywhere}.check{font-size:15.84px!important}
summary,[data-slot="accordion-trigger"],.accordion-trigger{font-size:18px!important;line-height:1.55!important}
footer,.app-footer,.page-footer,.footer-note{font-size:12.96px!important;line-height:1.65!important}
.text-xs{font-size:12.96px!important}.text-sm{font-size:13.68px!important}.text-base{font-size:15.84px!important}.text-lg{font-size:18px!important}.text-xl{font-size:19.44px!important}.text-2xl{font-size:19.8px!important}.text-3xl{font-size:32px!important}
@media(max-width:800px){h1,.brand-title,.brand strong,.brand>span:not(.brand-mark),.app-header h1{font-size:26.64px!important}.hero-value,.capacity-value,.temperature-value,.secondary-result .temperature-value,.big,.hero-result strong,.hero-result output,.hero-result b{font-size:46.8px!important}.field,.field>span{overflow-wrap:anywhere}button{white-space:normal}}
@media(max-width:480px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))!important}.metrics>div:last-child:nth-child(odd){grid-column:1/-1}.mode-picker,.process-options{grid-template-columns:1fr!important}.brand{min-width:0}.brand p,.brand small{letter-spacing:.02em!important}.dimension-row{flex-wrap:wrap}.field-grid--two{grid-template-columns:1fr!important}}
@media(max-width:800px){.topbar,.app-header,.masthead{height:auto!important;min-height:76px;flex-wrap:wrap;row-gap:8px;padding-top:12px;padding-bottom:12px}.topbar .brand,.app-header .brand,.masthead .brand{max-width:100%}}

.hero-result>span:first-child{font-size:15.84px!important;line-height:1.5!important}.hero-result em,.big .unit{font-size:18px!important}

/* Size the actual numeric element, including nested HX values. */
.hero-value>strong,.total-pressure>strong{font-size:50.4px!important;line-height:1.25!important}
.hero-value>span,.hero-result em,.big .unit{font-size:21.6px!important}
.stream strong,.uncertainty strong,.result-stats dd,.result-breakdown strong,.system-result-breakdown strong{font-size:19.8px!important}
.hero-value p,.hero-value p b{font-size:15.84px!important;line-height:1.6!important}
@media(max-width:800px){.hero-value>strong,.total-pressure>strong{font-size:46.8px!important}.hero-value,.big,.capacity-value,.temperature-value,.hero-result strong,.hero-result output,.hero-result b{font-size:46.8px!important}}
/* Compact formulas, substitutions and calculation explanations. */
:is(.formula-panel,.formula-reference,.formula-section,.calculation-report,.method-panel,.reference,.reference-card,.details,#formulas,.notes-panel){font-size:14px!important;line-height:1.7!important}
:is(.formula-panel,.formula-reference,.formula-section,.calculation-report,.method-panel,.reference,.reference-card,.details,#formulas,.notes-panel) :is(p,li,div,span,small,code,b,strong,dt,dd,td,th,a){font-size:14px!important;line-height:1.7!important}
:is(.formula-panel,.formula-reference,.formula-section,.calculation-report,.method-panel,.reference,.details,#formulas,.notes-panel) :is(h2,.panel-heading,.section-heading,.report-heading){font-size:18px!important;line-height:1.5!important}
:is(.formula-panel,.formula-reference,.formula-section,.calculation-report,.method-panel,.reference,.details,#formulas,.notes-panel) :is(h3,summary,[data-slot="accordion-trigger"],.accordion-trigger,.step-heading){font-size:16px!important;line-height:1.6!important}
.formula,.formula-box,.formula-line,.formula-content,.formula-content code,.accordion-body,.equation,.equation b,.inline-eq,.formula-general,.formula-substitution,.formula-result,.property-readout,.property-readout span,.property-readout code,.substitution,.calculation-steps,.calculation-step,.method-notes,.calculation-notes{font-size:14px!important;line-height:1.7!important}

</style><style id="tool-hero-layout-v1">
.tool-hero{max-width:1220px;margin:0 auto;padding:24px 26px 28px;color:var(--ink,#18314b);background:transparent}
.tool-hero-nav{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:28px}
.tool-home-link{color:var(--accent,#5654b7);font-size:18px!important;font-weight:650;line-height:1.4;text-decoration:none;white-space:nowrap}
.tool-home-link:hover{text-decoration:underline;text-underline-offset:4px}
.tool-install{min-height:48px!important;padding:10px 17px!important;border:1px solid #bdccd4!important;border-radius:13px!important;background:#fff!important;color:#18314b!important;font-size:17px!important;font-weight:700!important;line-height:1.35!important;white-space:nowrap!important;box-shadow:none!important}
.tool-hero-main{display:flex;align-items:center;gap:18px;min-width:0}
.tool-hero-logo{width:68px;height:68px;flex:0 0 68px;border-radius:19px;object-fit:contain}
.tool-hero-copy{min-width:0}
.tool-kicker{margin:0 0 6px;color:var(--accent,#5654b7);font-size:14px!important;font-weight:800;line-height:1.35!important;letter-spacing:.13em;text-transform:uppercase}
header.tool-hero h1{margin:0!important;color:var(--ink,#18314b);font-size:32px!important;font-weight:780!important;line-height:1.22!important;letter-spacing:-.025em}
.tool-hero-description{max-width:850px;margin:17px 0 0;color:var(--muted,#60778a);font-size:18px!important;line-height:1.65!important}
@media(max-width:800px){
.tool-hero{padding:20px 16px 24px}
.tool-hero-nav{margin-bottom:25px}
.tool-home-link{font-size:17px!important}
.tool-install{min-height:46px!important;padding:9px 14px!important;font-size:16px!important}
.tool-hero-main{gap:15px}
.tool-hero-logo{width:62px;height:62px;flex-basis:62px;border-radius:17px}
.tool-kicker{font-size:13px!important;letter-spacing:.11em}
header.tool-hero h1{font-size:28px!important;line-height:1.25!important}
.tool-hero-description{margin-top:15px;font-size:16px!important;line-height:1.65!important}
}
@media(max-width:380px){
.tool-hero-logo{width:56px;height:56px;flex-basis:56px}
.tool-kicker{font-size:11px!important}
header.tool-hero h1{font-size:25px!important}
.tool-home-link,.tool-install{font-size:15px!important}
}
</style></head>
<body>
  <div class="app-shell">
    <header class="tool-hero"><div class="tool-hero-nav"><a class="tool-home-link" href="https://pmebruce.github.io/engineering-toolbox/">← 工程工具箱</a><button class="tool-install" type="button" onclick="if(window.matchMedia('(display-mode: standalone)').matches){this.textContent='已安裝'}else{alert('iPhone：請點 Safari 的「分享」，再選「加入主畫面」。\\nAndroid：請在瀏覽器選單選擇「安裝應用程式」。')}">加入主畫面</button></div><div class="tool-hero-main"><img class="tool-hero-logo" src="./icons/icon-192.png" alt=""><div class="tool-hero-copy"><div class="tool-kicker">BATTERY / ENGINEERING LAB</div><h1>電池工程計算室</h1></div></div><p class="tool-hero-description">電池熱、電氣與系統容量的快速工程估算。</p></header>
    <div class="workspace">
      <aside class="sidebar" aria-label="計算工具">
        <div class="sidebar-heading"><span>計算工具</span><span id="tool-count"></span></div>
        <nav id="nav" class="nav-list"></nav>
        <p class="sidebar-note">所有計算都在本機瀏覽器完成。數值為初估，請以實際電芯資料與量測驗證。</p>
      </aside>
      <main class="main-content" id="main">
        <section class="tool-finder" aria-labelledby="finder-heading">
          <div class="finder-heading"><div><h2 id="finder-heading">快速找工具</h2><p>先選用途，或輸入關鍵字</p></div><span id="finder-count" aria-live="polite"></span></div>
          <label class="sr-only" for="tool-search">搜尋計算工具</label>
          <input id="tool-search" type="search" placeholder="搜尋：DCIR、冷量、容量、電阻…" autocomplete="off">
          <div id="finder-filters" class="finder-filters" aria-label="工具用途"></div>
          <div id="finder-results" class="finder-results"></div>
        </section>
        <div class="tool-heading"><div><p class="eyebrow" id="category"></p><h1 id="tool-title"></h1><p class="tool-description" id="tool-description"></p></div><span class="tool-index" id="tool-index"></span></div>
        <div class="calculator-grid">
          <section class="panel inputs-panel" aria-labelledby="inputs-heading"><div class="panel-heading"><h2 id="inputs-heading">輸入條件</h2><span>修改後即時計算</span></div><form id="input-form" autocomplete="off"></form></section>
          <section class="panel results-panel" aria-labelledby="results-heading"><div class="panel-heading"><h2 id="results-heading">估算結果</h2><span id="result-status">即時計算</span></div><div id="results" aria-live="polite"></div></section>
        </div>
        <section class="chart-panel" id="charts" aria-label="放電期間趨勢圖" hidden></section>
        <section class="method-panel" aria-labelledby="method-heading"><div class="method-head"><h2 id="method-heading">計算式與使用邊界</h2></div><div id="method"></div></section>
        <footer>數值僅供工程初估 · 電池工程計算室</footer>
      </main>
    </div>
  </div>
  <script src="./app.js" defer></script>
</body>
</html>
